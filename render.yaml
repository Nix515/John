services:
  - type: web
    name: northstar-xau-trading
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: CACHE_TTL_MS
        value: "30000"
      - key: POLL_INTERVAL_MS
        value: "60000"
